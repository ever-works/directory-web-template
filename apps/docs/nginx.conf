server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Redirects nginx issues itself (e.g. /foo -> /foo/ for a directory) must keep the client's
    # scheme. TLS ends at the edge, so this server only ever sees http and an absolute Location
    # came out as http://<host>/foo/, which the edge then bounced back to https - two hops for
    # every slash-less URL. A relative Location resolves against the URL the client requested.
    absolute_redirect off;

    # Standard text-asset compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # Long cache for hashed/static assets emitted by Docusaurus
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # No cache for HTML so deploys ship instantly
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # Serve clean URLs (Docusaurus emits both /foo/ and /foo/index.html)
    location / {
        try_files $uri $uri/ $uri.html $uri/index.html =404;
    }

    # Custom 404 page from Docusaurus. Every 404 ends here (error_page is an internal redirect, so
    # this location's headers are the ones sent), and a 404 must never be cached, by the edge or
    # the browser. While a deploy rolls, the old pod still answers some requests and has none of
    # the new build's hashed files (/assets/js/runtime~main.<hash>.js). Its 404 had no
    # Cache-Control, so Cloudflare kept it at the edge (cf-cache-status HIT) and gave it to
    # browsers with max-age=14400: docs.demo.ever.works did not hydrate for up to 4 h after a
    # deploy. `always` is needed: add_header skips error responses otherwise.
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-store" always;
    }
}
